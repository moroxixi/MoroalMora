<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>Baca — Read-Dashboard</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="read.css" />
  </head>
  <body class="page-read">
    <nav class="toolbar" aria-label="Navigasi dokumen">
      <a class="btn btn-ghost" href="../index.html">&larr; Kembali</a>
      <span class="spacer"></span>
      <a id="edit-btn" class="btn" href="../index.html">Edit</a>
    </nav>

    <main class="reader">
      <div id="state-loading" class="state">Memuat dokumen…</div>

      <div id="state-error" class="state" hidden>
        <p id="error-msg" class="state-msg"></p>
        <button id="retry-btn" type="button" class="btn">Coba lagi</button>
      </div>

      <div id="state-setup" class="state" hidden>
        <p id="setup-msg" class="state-msg"></p>
      </div>

      <article id="doc-view" hidden>
        <h1 id="doc-title" class="reader-title"></h1>
        <div class="reader-meta">
          <time id="doc-date"></time>
          <span id="doc-tipe" class="badge"></span>
        </div>
        <div id="doc-body" class="prose"></div>
      </article>
    </main>

    <script src="../config.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/18.0.14/lib/marked.umd.min.js"
            integrity="sha512-trN9mtGYvoySPVI909KTnwbJI9AkKPydRCV/qAsUG1+q39hhpKltEag9b5JpdjeIZn5i8IH62hHRFdbKwMFh9w=="
            crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.16/purify.min.js"
            integrity="sha512-flQmhkXNRQ3iUfvtdCobtpMjCb6kE+zLnTiAulAQJ3WykVfy84JvCMOo6vhwWXHTXjR25h9Zj+LyGFRWKjRoag=="
            crossorigin="anonymous"></script>
    <script src="../api.js"></script>
    <script src="read.js"></script>
  </body>
</html>
