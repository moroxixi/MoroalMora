<title>Data Kondangan</title>
<style>
:root{
  --bg:#000000;
  --bg-card:#0a0a0c;
  --bg-elevated:#111113;
  --bg-input:#0e0e10;
  --border:#1c1c1f;
  --border-soft:#161618;
  --text-primary:#e8e8ec;
  --text-secondary:#9a9aa0;
  --text-muted:#555558;
  --accent:#5dcaa5;
  --accent-dim:rgba(93,202,165,0.12);
  --accent-glow:rgba(93,202,165,0.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text-primary);line-height:1.5;padding-bottom:80px}
.header{background:var(--bg);border-bottom:1px solid var(--border-soft);color:var(--text-primary);padding:20px 16px;text-align:center}
.header h1{font-size:1.4em;margin-bottom:4px;font-weight:600}
.header .subtitle{font-size:0.85em;color:var(--text-secondary)}
.summary{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--border-soft);justify-content:center}
.summary .badge{background:var(--bg-elevated);color:var(--text-secondary);padding:6px 12px;border-radius:20px;font-size:0.82em;font-weight:600;border:1px solid var(--border)}
.summary .badge.total{background:var(--accent-dim);color:var(--accent);border-color:rgba(93,202,165,0.2)}
.search-wrap{position:sticky;top:0;z-index:100;background:var(--bg);padding:10px 16px;border-bottom:1px solid var(--border-soft)}
.search-wrap input{width:100%;padding:14px 16px;font-size:16px;border:1px solid var(--border);border-radius:8px;background:var(--bg-input);color:var(--text-primary);outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap input::placeholder{color:var(--text-muted)}
.counter{text-align:center;padding:8px 16px 0;font-size:0.82em;color:var(--text-muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--border-soft);justify-content:center}
.chip{padding:8px 14px;border-radius:20px;font-size:0.82em;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-secondary);transition:all .2s;min-height:40px;display:flex;align-items:center;-webkit-user-select:none;user-select:none}
.chip.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(93,202,165,0.3)}
.chip:not(.active):active{background:var(--bg-card)}
.results{padding:0 16px;margin-top:8px}
.category{margin-bottom:16px}
.cat-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg-elevated);color:var(--text-primary);border:1px solid var(--border);border-bottom:none;border-radius:8px 8px 0 0;font-weight:700;font-size:0.95em;position:sticky;top:58px;z-index:50}
.cat-header .count{font-weight:400;font-size:0.85em;color:var(--accent)}
.entries{background:var(--bg-card);border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;overflow:hidden}
.entry{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border-soft);font-size:0.9em;min-height:40px}
.entry:last-child{border-bottom:none}
.entry-name{flex:1;padding-right:12px}
.entry-name .num{color:var(--text-muted);margin-right:6px;font-size:0.85em}
.entry-name .text{word-break:break-word;color:var(--text-secondary)}
.entry-amount{white-space:nowrap;font-weight:600;color:var(--accent);font-size:0.9em}
.entry-amount.kado{color:var(--text-muted);font-weight:400;font-style:italic;font-size:0.85em}
.no-results{text-align:center;padding:40px 16px;color:var(--text-muted);font-size:0.95em}
.no-results span{font-size:2em;display:block;margin-bottom:8px}
@media(max-width:480px){
  .header h1{font-size:1.2em}
  .cat-header{top:52px}
  .entry{padding:8px 10px;font-size:0.85em}
}
</style>
</head>

var AMOUNT_RE = /(\d+)\s*r+b\b/i;
var NUM_RE = /^\d+\s*\.?\s*/;

function parseData(rawText, categoryLabel) {
  var lines = rawText.split("\n");
  var entries = [];
  for (var i = 0; i < lines.length; i++) {
    var raw = lines[i].trim();
    if (raw.length === 0) continue;
    var m = raw.match(AMOUNT_RE);
    var amount = m ? parseInt(m[1], 10) * 1000 : null;
    var stripped = raw.replace(NUM_RE, "");
    var isKado = categoryLabel === "Kado";
    entries.push({ raw: raw, stripped: stripped, amount: amount, isKado: isKado });
  }
  return entries;
}

var allData = [];
for (var ci = 0; ci < CATEGORIES.length; ci++) {
  var cat = CATEGORIES[ci];
  allData.push({ key: cat.key, label: cat.label, entries: parseData(cat.data, cat.label) });
}

// --- TOTALS ---
var totalEntries = 0;
var totalNominal = 0;
for (var ci = 0; ci < allData.length; ci++) {
  var cat = allData[ci];
  totalEntries += cat.entries.length;
  for (var ei = 0; ei < cat.entries.length; ei++) {
    if (cat.entries[ei].amount !== null) totalNominal += cat.entries[ei].amount;
  }
}

function formatRp(n) {
  var s = n.toString();
  var result = "";
  var count = 0;
  for (var i = s.length - 1; i >= 0; i--) {
    count++;
    result = s[i] + result;
    if (count % 3 === 0 && i > 0) result = "." + result;
  }
  return result;
}

// --- SUMMARY ---
var summaryEl = document.getElementById("summary");
summaryEl.innerHTML = '<span class="badge total">📊 Total: ' + totalEntries + ' entri</span>' +

for (var ci = 0; ci < CATEGORIES.length; ci++) { activeFilters[CATEGORIES[ci].key] = true; }
var chipsEl = document.getElementById("chips");

function renderChips() {
  chipsEl.innerHTML = "";
  for (var ci = 0; ci < CATEGORIES.length; ci++) {
    var cat = CATEGORIES[ci];
    var chip = document.createElement("div");
    chip.className = "chip" + (activeFilters[cat.key] ? " active" : "");
    chip.textContent = cat.label + " (" + allData[ci].entries.length + ")";
    chip.setAttribute("data-key", cat.key);
    (function(k) {
      chip.addEventListener("click", function() {
        activeFilters[k] = !activeFilters[k];
        renderChips();
        doSearch();
      });
    })(cat.key);
    chipsEl.appendChild(chip);
  }
}

var searchEl = document.getElementById("search");
var counterEl = document.getElementById("counter");
var resultsEl = document.getElementById("results");

function doSearch() {
  var q = searchEl.value.toLowerCase().trim();
  var totalFound = 0;
  var html = "";

  for (var ci = 0; ci < allData.length; ci++) {
    var cat = allData[ci];
    if (!activeFilters[cat.key]) continue;
    var matched = [];
    for (var ei = 0; ei < cat.entries.length; ei++) {
      var e = cat.entries[ei];
      if (!q || e.raw.toLowerCase().indexOf(q) !== -1) {
        matched.push(e);
      }
    }
    if (matched.length === 0) continue;
    totalFound += matched.length;

    html += '<div class="category">';
    html += '<div class="cat-header"><span>' + cat.label + '</span><span class="count">' + matched.length + ' entri</span></div>';
    html += '<div class="entries">';
    for (var mi = 0; mi < matched.length; mi++) {
      var me = matched[mi];
      html += '<div class="entry">';
      html += '<div class="entry-name"><span class="num">' + (mi + 1) + '.</span><span class="text">' + escapeHtml(me.raw) + '</span></div>';
      if (me.amount !== null) {
        html += '<div class="entry-amount">Rp ' + formatRp(me.amount) + '</div>';
      } else if (me.isKado) {
        html += '<div class="entry-amount kado">kado</div>';
      }
      html += '</div>';
    }
    html += '</div></div>';
  }

  if (q) {
    counterEl.textContent = totalFound + " hasil ditemukan";
  } else {
    counterEl.textContent = "";
  }

  if (!q && !html) {
    html = '<div class="no-results"><span>📋</span>Pilih kategori untuk melihat data</div>';
  } else if (q && totalFound === 0) {
    html = '<div class="no-results"><span>🔍</span>Tidak ada hasil untuk "' + escapeHtml(q) + '"</div>';
  }
  resultsEl.innerHTML = html;
}

function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

searchEl.addEventListener("input", doSearch);
doSearch();
</script>
</body>
</html>
